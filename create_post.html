<!DOCTYPE html>
<html lang="fi">

<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foorumi</title>
</head>

<body>
    <header class="body-header">
        <nav>
            <h1 class="navbar-button">
                <a href="index.html" >Foorumi</a>
            </h1>
        </nav>
        <nav>
            <a href="index.html" class="navbar-button hover-button" >Asetukset</a>
            <a href="profile.html" class="navbar-button hover-button">Profiili</a>
        </nav>
    </header>
    <main class="main-content">
        <section class="create-post-section">
            <div class="create-post-top">
                <a href="index.html" class="back-btn hover-button"><img src="images/icons/back.png" alt="" width="24" height="24"></a>
                <h2>Uuden postauksen luonti</h2>
            </div>

            <form action="/submit" method="post" class="create-post-form">
                <label for="title">Postauksen otsikko</label>
                <input type="text" id="title" name="post-title" required>
                    
                <label for="message">Postauksen teksti</label>
                <textarea id="message" name="message" rows="8"></textarea>

                <label for="file">Postauksen tiedosto</label>
                <input type="file" id="file" name="file">

                <button type="submit" class="btn hover-button-alt">Luo postaus</button>
            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
