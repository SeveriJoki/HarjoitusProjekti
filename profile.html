<!DOCTYPE html>
<html lang="fi">

<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foorumi</title>
</head>

<body>
    <header class="body-header">
        <nav>
            <h1 class="navbar-button">
                <a href="index.html" >Foorumi</a>
            </h1>
        </nav>
        <nav>
            <a href="index.html" class="navbar-button hover-button" >Asetukset</a>
            <a href="profile.html" class="navbar-button hover-button selected">Profiili</a>
        </nav>
    </header>
    <main class="main-content">
        <section class="profile-section">
            <article class="profile-header">
                <img src="images/profile_pictures/empty_profile.png" class="profile-picture" alt="Käyttäjän profiilikuva">
                <div class="profile-header-content">
                    <h1>Pertsa Kallio</h1>
                    <div class="profile-header-text">
                        <div class="profile-header-cell">
                            <img src="images/icons/location.png" alt="Sijainti kuvake">
                            <p>Sijainti: Kokkola</p>
                        </div>
                        <div class="profile-header-cell">
                            <img src="images/icons/school.png" alt="Koulu kuvake">
                            <p>Koulu: Centria</p>
                        </div>
                        <div class="profile-header-cell">
                            <img src="images/icons/hobbies.png" alt="Harrastukset kuvake">
                            <p>Harrastukset: Jääkiekko</p>
                        </div>
                    </div>
                </div>
            </article>
            <div class="profile-main-content">
                <article class="profile-article">
                    <header class="profile-article-header"><h2>Minä</h2></header>
                    <div>
                        <p>Moi olen Pertsa. Asun kokkolassa ja pelaan jääkiekkoa. Tässä hieno kuva paikassa jossa kävin.</p>
                        <img src="images/post_images/mountains.jpg" class="me-section-image" alt="Pilvien takana olevia vuoristoja">
                        <p><br>Tässä sitä ollaankin jo pelikentillä! </p>

                        <img src="images/post_images/hockey.jpg" class="me-section-image" alt="Kaksi jääkiekkoilijaa jäällä">
                    </div>



                </article>
                <article class="profile-article">
                    <header class="profile-article-header"><h2>Kaikki Postaukseni</h2></header>
                    <div>

                    </div>
                </article>
                <article class="profile-article">
                    <header class="profile-article-header"><h2>Kaikki Kommenttini</h2></header>
                    <div>

                    </div>
                </article>
            </div>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
